<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>오답법정</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Nanum+Myeongjo:wght@700;800&display=swap" rel="stylesheet">
<style>
:root{
 --bg:#100C08;--wood:#241A11;--wood2:#2F2317;--wood3:#3A2C1D;
 --brass:#E0B53A;--brass2:#9C7B20;--brass3:#5A470F;
 --parch:#F3EAD6;--parch2:#E2D6BC;--ink:#1F1A12;
 --tx:#EFE6D6;--dm:#A39478;--ox:#E0524B;--sa:#5FC07A;--wa:#E8B53A;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font-family:'IBM Plex Sans KR',system-ui,sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
.my{font-family:'Nanum Myeongjo',serif;font-weight:800}
.mono{font-family:'IBM Plex Mono',monospace}
.hide{display:none!important}
.vig{position:fixed;inset:0;pointer-events:none;z-index:44;
 background:radial-gradient(ellipse at 50% 15%,rgba(224,181,58,.13),transparent 55%),radial-gradient(ellipse at 50% 50%,transparent 50%,rgba(0,0,0,.7) 100%)}
.app{max-width:430px;margin:0 auto;height:100dvh;display:flex;flex-direction:column;position:relative;z-index:1}
section{flex:1;display:flex;flex-direction:column;min-height:0;padding:14px}
.scroll{flex:1;overflow-y:auto;min-height:0;padding:2px 2px 8px}

/* 공용 */
.panel{background:linear-gradient(168deg,var(--wood2),var(--wood) 70%);border:1px solid var(--brass3);border-radius:16px;
 box-shadow:inset 0 1px 0 rgba(224,181,58,.2),0 6px 16px rgba(0,0,0,.45)}
.btn{width:100%;padding:15px;border-radius:14px;font-family:'Nanum Myeongjo',serif;font-weight:800;font-size:16px;letter-spacing:.03em;
 background:linear-gradient(178deg,#F0C44A,#B98C1E);color:#2a1d05;box-shadow:0 5px 0 #6e5410,0 8px 18px rgba(0,0,0,.4)}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #6e5410}
.btn:disabled{opacity:.35;transform:none;box-shadow:0 5px 0 #6e5410}
.btn.g{background:var(--wood2);color:var(--dm);border:1px solid var(--wood3);box-shadow:none;font-size:14px}
.row2{display:flex;gap:8px}

/* 판사 */
.judge{width:96px;height:96px}
.judge.mini{width:46px;height:46px;flex:0 0 46px}
.judge.bounce{animation:jb .5s}
@keyframes jb{0%,100%{transform:none}40%{transform:translateY(-8px) rotate(-4deg)}}
.guide{display:flex;gap:9px;align-items:flex-start;margin-bottom:12px}
.guide .gb{flex:1;padding:10px 12px;border-radius:4px 14px 14px 14px;background:var(--parch);color:var(--ink);font-size:12.5px;line-height:1.55}
.guide .gb b{color:#8a5a00}

/* 홈 */
.home{justify-content:center;text-align:center;align-items:center}
.logo{font-size:44px;color:var(--parch);letter-spacing:.05em;margin:8px 0 4px;text-shadow:0 0 20px rgba(224,181,58,.35)}
.logo b{color:var(--brass)}
.tag{font-size:13px;color:var(--dm);margin-bottom:22px}
.rankpill{display:inline-flex;gap:8px;align-items:center;padding:7px 14px;border-radius:999px;background:var(--wood2);border:1px solid var(--brass3);font-size:12.5px;margin-bottom:18px}
.rankpill b{color:var(--brass)}

/* 튜토리얼 카드 */
.tcard{padding:22px 18px;text-align:center;margin-bottom:12px}
.tcard .e{font-size:44px}
.tcard h3{margin:8px 0 6px;font-size:18px;color:var(--parch)}
.tcard p{margin:0;font-size:13px;color:var(--dm);line-height:1.7}
.terms{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:12px;text-align:left}
.terms div{padding:9px 10px;border-radius:10px;background:rgba(0,0,0,.25);font-size:11.5px;color:var(--dm);line-height:1.45}
.terms b{display:block;color:var(--brass);font-size:12.5px}
.dots{display:flex;gap:6px;justify-content:center;margin:4px 0 16px}
.dots i{width:7px;height:7px;border-radius:9px;background:var(--wood3)}
.dots i.on{width:20px;background:var(--brass)}

/* 지도 */
.topbar{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.topbar .ttl{flex:1;font-size:18px;color:var(--parch)}
.ib{width:38px;height:38px;border-radius:11px;background:var(--wood2);border:1px solid var(--wood3);font-size:16px}
.stars{color:var(--brass);letter-spacing:1px}
.stars i{font-style:normal;color:var(--wood3)}
.tier{margin-bottom:16px}
.tier .th{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--brass);margin-bottom:8px;padding:0 2px}
.tier .th small{color:var(--dm);font-size:11px}
.node{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:12px 14px;margin-bottom:8px}
.node .ic{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-size:22px;background:rgba(224,181,58,.1);border:1px solid var(--brass3)}
.node .nm{flex:1}
.node .nm b{display:block;font-size:14px;color:var(--parch)}
.node .nm small{font-size:11px;color:var(--dm)}
.node.lk{opacity:.4}
.node:active{transform:scale(.98)}

/* 플레이 */
.prog{display:flex;gap:4px;margin-bottom:12px}
.prog .p{flex:1;text-align:center;font-size:15px;padding:5px 0;border-radius:9px;background:var(--wood);border:1px solid var(--wood3);opacity:.45}
.prog .p.done{opacity:.8;border-color:var(--brass3)}
.prog .p.on{opacity:1;border-color:var(--brass);background:#3E2F1B;box-shadow:0 0 10px rgba(224,181,58,.35)}
.stepname{font-size:12px;color:var(--brass);margin:-4px 0 10px;letter-spacing:.06em}
.combo{font-size:12px;color:var(--wa);font-weight:700}
.cond{padding:13px 14px;margin-bottom:10px}
.cond .ch{font-size:11px;color:var(--brass);letter-spacing:.12em;margin-bottom:8px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:9px}
.cchip{padding:7px 11px;border-radius:9px;background:var(--parch);color:var(--ink);font-family:'IBM Plex Mono',monospace;font-size:13px;font-weight:600;border-left:3px solid var(--brass)}
.goal{font-size:13px;color:var(--parch2);padding-top:9px;border-top:1px dashed rgba(224,181,58,.25)}
.lines .ln{display:flex;gap:10px;align-items:flex-start;padding:11px 12px;margin-bottom:7px;border-radius:12px;background:var(--parch);color:var(--ink);font-size:13.5px;line-height:1.55;border:2px solid transparent;transition:.12s}
.lines .ln .no{flex:0 0 24px;height:24px;border-radius:50%;display:grid;place-items:center;background:var(--wood3);color:var(--parch);font-size:12px;font-weight:700}
.lines.pick .ln{cursor:pointer}
.lines .ln.sel{border-color:var(--brass);background:#FFF6DE;box-shadow:0 0 0 3px rgba(224,181,58,.3)}
.lines .ln.sel .no{background:var(--brass);color:#2a1d05}
.lines .ln.right{border-color:var(--sa)}
.lines .ln.right .no{background:var(--sa)}
.lines .ln.wrong{border-color:var(--ox)}
.lines .ln.wrong .no{background:var(--ox)}
.sh{font-size:13.5px;color:var(--parch);margin:14px 0 8px;font-weight:700}
.opt{display:block;width:100%;text-align:left;padding:12px 13px;margin-bottom:7px;border-radius:12px;background:var(--wood2);border:1px solid var(--wood3);font-size:13px;line-height:1.55}
.opt.sel{border-color:var(--brass);background:#3E2F1B;box-shadow:0 0 0 2px rgba(224,181,58,.25)}
.opt.right{border-color:var(--sa);background:rgba(95,192,122,.12)}
.opt.wrong{border-color:var(--ox);background:rgba(224,82,75,.12)}
.opt.part{border-color:var(--wa);background:rgba(232,181,58,.12)}
.opt:disabled{cursor:default}
.bets{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.bet{padding:14px 6px;border-radius:14px;background:var(--wood2);border:1px solid var(--wood3);text-align:center}
.bet .e{font-size:26px;display:block}
.bet b{display:block;font-size:13px;margin-top:4px}
.bet small{font-size:10.5px;color:var(--dm)}
.bet.sel{border-color:var(--brass);background:#3E2F1B}
.claim{display:flex;gap:9px;margin-bottom:10px}
.claim .cb{flex:1;padding:11px 13px;border-radius:4px 14px 14px 14px;background:#3a1714;border:1px solid var(--ox);font-size:13px;line-height:1.6}
.claim .cb small{display:block;color:var(--ox);font-size:10.5px;letter-spacing:.1em;margin-bottom:4px}
.fb{padding:11px 13px;border-radius:12px;font-size:12.5px;line-height:1.6;margin:4px 0 8px;border-left:3px solid}
.fb.ok{background:rgba(95,192,122,.1);border-color:var(--sa)}
.fb.part{background:rgba(232,181,58,.1);border-color:var(--wa)}
.fb.no{background:rgba(224,82,75,.1);border-color:var(--ox)}
.fb b{display:block;margin-bottom:2px}
.fb.ok b{color:var(--sa)}.fb.part b{color:var(--wa)}.fb.no b{color:var(--ox)}
details.ref{margin-bottom:10px}
details.ref summary{list-style:none;cursor:pointer;padding:10px 13px;font-size:12px;color:var(--brass);display:flex;justify-content:space-between}
details.ref summary::-webkit-details-marker{display:none}
details.ref .in{padding:0 12px 10px}
.foot{padding-top:10px}

/* 판결 도장 */
.stamp{position:fixed;left:50%;top:42%;z-index:80;transform:translate(-50%,-50%) rotate(-12deg) scale(2.4);opacity:0;pointer-events:none;
 font-family:'Nanum Myeongjo',serif;font-weight:800;font-size:46px;padding:6px 22px;border:6px solid;border-radius:12px;letter-spacing:.08em}
.stamp.on{animation:st 1.1s cubic-bezier(.2,1.2,.4,1) forwards}
@keyframes st{0%{opacity:0;transform:translate(-50%,-50%) rotate(-12deg) scale(2.4)}22%{opacity:1;transform:translate(-50%,-50%) rotate(-12deg) scale(1)}75%{opacity:1}100%{opacity:0}}
.stamp.ok{color:var(--sa);border-color:var(--sa);background:rgba(16,40,22,.85)}
.stamp.part{color:var(--wa);border-color:var(--wa);background:rgba(40,30,8,.85)}
.stamp.no{color:var(--ox);border-color:var(--ox);background:rgba(40,12,10,.85)}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);z-index:70;padding:9px 16px;border-radius:999px;background:#3E2F1B;border:1px solid var(--brass);color:var(--brass);font-size:13px;font-weight:700;opacity:0;pointer-events:none;white-space:nowrap}
.toast.on{animation:ts 1.6s ease-out}
@keyframes ts{0%{opacity:0;transform:translateX(-50%) translateY(8px)}15%{opacity:1;transform:translateX(-50%)}80%{opacity:1}100%{opacity:0}}

/* 판결 */
.verdict{text-align:center;padding:6px 0 12px}
.verdict .big{font-size:44px;margin:4px 0}
.verdict .vs{font-size:13px;color:var(--dm)}
.bd{display:flex;align-items:center;gap:9px;padding:9px 12px;border-radius:10px;background:rgba(0,0,0,.25);margin-bottom:6px;font-size:12.5px}
.bd .e{font-size:16px}.bd .l{flex:1;color:var(--dm)}
.bd .v{font-family:'IBM Plex Mono',monospace;font-weight:700}
.v.pos{color:var(--sa)}.v.neg{color:var(--ox)}.v.zero{color:var(--dm)}
</style>
</head>
<body>
<div class="vig"></div>
<div class="app">

<section id="scHome" class="home"></section>
<section id="scHow" class="hide" style="justify-content:center"></section>
<section id="scMap" class="hide"></section>
<section id="scPlay" class="hide"></section>
<section id="scVerdict" class="hide"></section>

</div>
<div class="stamp" id="stamp"></div>
<div class="toast" id="toast"></div>

<script>
const $=i=>document.getElementById(i);
const SC=['scHome','scHow','scMap','scPlay','scVerdict'];
function show(id){SC.forEach(s=>$(s).classList.toggle('hide',s!==id));}
function toast(m){const t=$('toast');t.textContent=m;t.classList.remove('on');void t.offsetWidth;t.classList.add('on');}
function stamp(k){const s=$('stamp');s.className='stamp';s.textContent={ok:'인정!',part:'일부 인정',no:'기각!'}[k];
 void s.offsetWidth;s.classList.add('on',k);}

/* ── 판사 캐릭터 ── */
function judge(m='idle',cls=''){
 const brow={idle:'M27 35 L36 35 M53 35 L44 35',happy:'M27 34 Q31 31 36 34 M53 34 Q49 31 44 34',angry:'M26 32 L36 36 M54 32 L44 36'}[m];
 const mouth={idle:'M35 50 L45 50',happy:'M33 48 Q40 55 47 48',angry:'M33 52 Q40 46 47 52'}[m];
 return `<svg viewBox="0 0 80 80" class="judge ${cls}">
  <path d="M14 80 Q16 58 40 58 Q64 58 66 80Z" fill="#161616"/>
  <path d="M36 58 L40 66 L44 58Z" fill="#fff"/>
  <circle cx="40" cy="40" r="18" fill="${m==='angry'?'#f2a48f':'#f2c9a0'}"/>
  <circle cx="21" cy="40" r="6" fill="#efefef"/><circle cx="59" cy="40" r="6" fill="#efefef"/>
  <circle cx="21" cy="50" r="5" fill="#efefef"/><circle cx="59" cy="50" r="5" fill="#efefef"/>
  <path d="M21 36 Q20 18 40 17 Q60 18 59 36 Q54 28 40 28 Q26 28 21 36Z" fill="#efefef"/>
  <path d="${brow}" stroke="#333" stroke-width="2.6" stroke-linecap="round" fill="none"/>
  <circle cx="32" cy="41" r="2.2" fill="#333"/><circle cx="48" cy="41" r="2.2" fill="#333"/>
  <path d="${mouth}" stroke="#333" stroke-width="2.4" stroke-linecap="round" fill="none"/>
  ${m==='happy'?'<circle cx="28" cy="46" r="3" fill="#f5a3a3" opacity=".6"/><circle cx="52" cy="46" r="3" fill="#f5a3a3" opacity=".6"/>':''}
 </svg>`;
}

/* ══════ 사건 데이터 (미적분Ⅰ) ══════
   cond: 조건 칩 / goal: 풀이가 보이려는 것 / brk: 처음 틀린 줄
   why: 오류 이유(사건별 개별) / ev: 증거(s=2 완전,1 일부,0 기각)
   rival: 변호인 주장 / q: 최후질문 / fix: 고치기 */
const CASES=[
{id:'t1',tier:0,ic:'📈',unit:'도함수의 활용',title:'증가함수의 함정',
 cond:["f'(x) > 0 (모든 실수 x)","f(0) = -1"],goal:'풀이의 주장: f(1) > 0',
 steps:["f'(x) > 0 이므로 f는 증가함수다.","따라서 f(1) > f(0) = -1 이다.","그러므로 f(1) > 0 이다."],brk:3,
 why:[{t:"f'(x) > 0 에서 \"증가함수\"라고 한 게 틀렸다"},{t:"알 수 있는 건 f(1) > -1 까지인데, f(1) > 0 이라고 했다",ok:1},{t:'f(0) = -1 을 잘못 대입했다'},{t:'f(1)과 f(0)의 크기를 거꾸로 비교했다'}],
 ev:[{t:'반례: f(x) = x/2 - 1 이면 조건을 모두 지키는데 f(1) = -1/2 < 0 이다.',s:2,d:'조건은 지키면서 결론만 무너뜨리는 진짜 반례다.'},
  {t:'논리: 2번째 줄에서 얻은 건 f(1) > -1 뿐이다. 0을 넘는다는 근거는 어디에도 없다.',s:2,d:'결론이 앞 줄에서 따라 나오지 않음을 바로 보인다.'},
  {t:'-1에서 출발하니 조금만 증가하면 0을 못 넘을 수도 있다.',s:1,d:'방향은 맞지만 "그럴 수도 있다"에 그쳐 확실하지 않다.'},
  {t:'반례: f(x) = -x - 1 이면 f(1) = -2 < 0 이다.',s:0,d:"f'(x) = -1 < 0 이라 조건을 어긴다. 조건을 어긴 함수는 반례가 될 수 없다."}],
 rival:{claim:'증가함수이고 f(0) = -1 이니, 그래프가 오른쪽 위로 올라가는 이상 f(1)이 0을 넘는 건 당연합니다.',
  opts:[{t:'맞는 말이다 — 올라가는 그래프라면 0을 넘는다.'},{t:'근거가 없다 — -1보다 크다는 것과 0보다 크다는 건 다른 얘기인데, 0을 넘는 근거가 없다.',ok:1},{t:'요점을 벗어났다 — 변호인은 1번째 줄 얘기를 하고 있다.'},{t:'조건을 빠뜨렸다 — f(0) = -1 을 쓰지 않았다.'}]},
 q:[{t:'정답은 f(1) > -1 아닐까?',d:'질문이 아니라 답을 알려준 것이다.'},{t:'-1보다 큰 수는 반드시 양수일까?',ok:1},{t:'미분이 뭔지는 알아?',d:'핵심과 상관없는 추궁이다.'},{t:'어디가 틀렸는지 알겠어?',d:'너무 막연해서 어디를 봐야 할지 모른다.'}],
 fix:[{t:'"f는 항상 양수다"로 고친다.',d:'근거 없이 더 크게 주장한다.'},{t:'"f(1)은 알 수 없다"로 고친다.',d:'f(1) > -1 은 증명할 수 있는데 그것까지 버린다.'},{t:'3번째 줄을 지우고 "f(1) > -1"까지만 결론짓는다.',ok:1},{t:'2번째 줄까지 전부 지운다.',d:'맞는 내용까지 버리는 과한 수정이다.'}]},

{id:'l1',tier:1,ic:'🎯',unit:'함수의 극한',title:'0으로 나누면 끝?',
 cond:['(x² - 4) / (x - 2)'],goal:'구하려는 것: x → 2 일 때의 극한값',
 steps:['x = 2를 대입하면 분모 x - 2 가 0이 된다.','분모가 0이 되므로 극한값은 존재하지 않는다.','따라서 이 극한은 발산한다.'],brk:2,
 why:[{t:'1번째 줄 대입 계산이 틀렸다'},{t:'분자도 0이 되는 0/0 꼴이면 극한이 있을 수 있는데, 바로 "없다"고 했다',ok:1},{t:'"발산"이라는 말의 뜻을 잘못 썼다'},{t:'x → 2 를 x → 0 으로 착각했다'}],
 ev:[{t:'약분: x ≠ 2 이면 (x² - 4)/(x - 2) = x + 2 이므로 극한값은 4다.',s:2,d:'식을 바꿔 극한이 실제로 존재함을 보인다.'},
  {t:'그래프: 이 함수는 직선 y = x + 2 에서 점 (2, 4) 하나만 뚫린 모양이다.',s:2,d:'구멍 근처 값이 4로 모인다는 것을 한눈에 보인다.'},
  {t:'x = 1.99, 2.01 을 넣으면 3.99, 4.01 이 나온다.',s:1,d:'4에 가까워지는 경향은 보이지만, 값 두 개로 극한을 확정할 순 없다.'},
  {t:'x = 2 에서 함숫값이 정의되지 않으니 극한도 없다.',s:0,d:'함숫값과 극한은 다르다. 학생과 같은 실수다.'}],
 rival:{claim:'x = 2 에서 함수가 정의조차 안 되는데, 극한값이 있을 리 없습니다.',
  opts:[{t:'맞는 말이다 — 정의되지 않는 점에선 극한도 없다.'},{t:'요점을 벗어났다 — 극한은 x = 2 "에서"가 아니라 2에 "가까워질 때"의 값을 본다.',ok:1},{t:'근거가 없다 — 사실 x = 2 에서 함숫값은 4다.'},{t:'조건을 빠뜨렸다 — 분자를 계산하지 않았다.'}]},

  {t:'계산: 5(x - 1) + 4 = 5x - 5 + 4 = 5x - 1 이다.',s:2,d:'틀린 계산을 정확히 짚는다.'},
  {t:"y' = 2x + 3 이 맞는지 다시 미분해본다.",s:0,d:'도함수는 맞다. 엉뚱한 곳을 확인했다.'},
  {t:'두 직선의 그래프를 그려본다.',s:1,d:'다르다는 건 보여도 어느 줄이 틀렸는지는 안 보인다.'}],

  {t:'증가: 계속 증가하는 함수라 x = 0 근처에 f(0)보다 작은 값과 큰 값이 모두 있다.',s:2,d:'극솟값의 뜻(근처에서 가장 작음)에 정면으로 어긋남을 보인다.'},

{id:'i1',tier:3,ic:'🟫',unit:'정적분과 넓이',title:'사라진 넓이',

  {t:'직접 계산: ∫₀¹ (1 - x²) dx = 2/3, ∫₁² (x² - 1) dx = 4/3 이므로 넓이는 2다.',s:2,d:'올바른 넓이를 구해 답이 다름을 보인다.'},

  {t:'그래프가 x = 1 에서 x축과 만난다.',s:1,d:'맞는 관찰이지만 그래서 무엇이 틀렸는지까지는 보이지 않는다.'}],

 fix:[{t:'답의 부호만 바꿔 -2/3 로 한다.',d:'넓이는 음수가 될 수 없다.'},{t:'구간을 [1, 2] 로 바꿔 4/3 로 한다.',d:'문제의 조건을 바꿨다.'},{t:'1번째 줄을 ∫₀² |x² - 1| dx 로 고치고, x = 1 에서 나누어 계산해 넓이 2를 구한다.',ok:1},{t:'부정적분을 다시 구한다.',d:'멀쩡한 줄을 건드린다.'}]},

  {t:'정의: 사이값 정리의 가정은 "닫힌구간에서 연속"이다. 이 문제엔 연속이 주어지지 않았다.',s:2,d:'정리를 쓸 자격이 없음을 정면으로 짚는다.'},

 '여기는 <b>오답법정</b>! 이 풀이는 어딘가 틀렸어요. 📋 조건과 풀이를 천천히 읽어보세요.',
 '풀이가 <b>처음</b> 틀어진 줄을 골라요. 뒤 줄이 틀린 건 앞 실수 때문일 수 있거든요. 그다음 <b>왜</b> 틀렸는지 골라요.',
 '얼마나 확신하나요? 맞으면 건 만큼 <b>얻고</b>, 틀리면 <b>잃어요</b>.',
 '왜 틀렸는지 보여줄 <b>증거</b>를 골라요. 반례는 조건을 다 지켜야 진짜 반례예요!',
 '<b>변호인</b>이 풀이 편을 들어요. 그 말이 맞는지 따져보세요.',
 '답을 바로 알려주지 말고, 풀이를 쓴 사람이 <b>스스로 깨닫게</b> 할 질문을 골라요.',
 '마지막! <b>가장 적게</b> 고쳐서 바르게 만드는 방법을 골라요. 너무 많이 고쳐도, 덜 고쳐도 안 돼요.'
];

/* ── 진행 기록 (세션 메모리) ── */
let STARS={},tutDone=false;
const totStars=()=>Object.values(STARS).reduce((a,b)=>a+b,0);
function tierOpen(t){if(t===0)return true;if(!tutDone)return false;return totStars()>=TIERS[t].need;}
function rank(){const s=totStars();
 if(s>=15)return{n:'⚖️ 대법관',next:null};if(s>=9)return{n:'👨‍⚖️ 판사',next:['대법관',15-s]};
 if(s>=4)return{n:'🧑‍💼 검사',next:['판사',9-s]};return{n:'🐣 새내기 검사',next:['검사',4-s]};}
function starStr(n){return `<span class="stars">${'★'.repeat(n)}<i>${'★'.repeat(3-n)}</i></span>`;}

/* ── 홈 ── */
function renderHome(){
 const r=rank();
 $('scHome').innerHTML=`${judge('idle','bounce')}
  <div class="logo my">오답법정<b>.</b></div>
  <div class="tag">틀린 풀이를 재판하라 · 미적분Ⅰ</div>
  ${tutDone?`<div class="rankpill">${r.n} · ⭐ <b>${totStars()}</b>${r.next?` · ${r.next[0]}까지 ${r.next[1]}`:''}</div>`:''}
  <div style="width:100%">
   ${tutDone?`<button class="btn" id="hMap">🗺 사건 지도</button>
    <button class="btn g" id="hHow" style="margin-top:10px">📘 게임 방법 다시 보기</button>`
   :`<button class="btn" id="hHow">▶ 튜토리얼 시작</button>`}
  </div>`;
 $('hHow').onclick=()=>{hi=0;renderHow();show('scHow');};
 if($('hMap'))$('hMap').onclick=()=>{renderMap();show('scMap');};
}

/* ── 튜토리얼 카드 ── */
const HOW=[
 {e:'⚖️',h:'오답법정이란?',p:'틀린 풀이를 재판하는 곳이에요. 당신은 <b style="color:var(--brass)">검사</b>! 풀이 속 오류를 찾아 증명하세요.',terms:1},
 {e:'🔍',h:'처음 틀린 곳을 찾아라',p:'풀이가 맨 처음 어긋난 줄과, 왜 틀렸는지를 골라요.'},
 {e:'🧾',h:'증거로 증명하고 반박하라',p:'증거를 고르고, 풀이 편을 드는 변호인의 말을 따져요.'},
 {e:'✏️',h:'질문하고, 최소한으로 고쳐라',p:'스스로 깨닫게 하는 최후질문을 던지고, 가장 적게 고쳐요.'}
];
let hi=0;
function renderHow(){
 const h=HOW[hi];
 $('scHow').innerHTML=`<div class="panel tcard"><div class="e">${h.e}</div><h3 class="my">${h.h}</h3><p>${h.p}</p>
  ${h.terms?`<div class="terms">
   <div><b>🧑‍⚖️ 피고</b>틀린 풀이를 쓴 사람(학생이나 AI)</div>
   <div><b>🗣 변호인</b>풀이 편을 들며 반박하는 사람</div>
   <div><b>🧾 증거</b>왜 틀렸는지 보여주는 근거</div>
   <div><b>⭐ 별</b>사건마다 최대 3개, 모으면 다음 단계가 열려요</div></div>`:''}</div>
  <div class="dots">${HOW.map((_,i)=>`<i class="${i===hi?'on':''}"></i>`).join('')}</div>
  <button class="btn" id="hn">${hi<HOW.length-1?'다음':tutDone?'사건 지도로':'연습 사건 시작 ▶'}</button>`;
 $('hn').onclick=()=>{if(hi<HOW.length-1){hi++;renderHow();}else if(tutDone){renderMap();show('scMap');}else startCase(0);};
}

/* ── 사건 지도 ── */
function renderMap(){
 const r=rank();
 $('scMap').innerHTML=`<div class="topbar"><button class="ib" id="mBack">🏠</button><div class="ttl my">사건 지도</div>
  <div class="rankpill" style="margin:0">⭐ <b>${totStars()}</b></div></div>
  <div class="scroll">${TIERS.map((t,ti)=>{
   const open=tierOpen(ti),list=CASES.map((c,i)=>({c,i})).filter(x=>x.c.tier===ti);
   return `<div class="tier"><div class="th"><span>${t.n}</span><small>${open?'':`🔒 별 ${t.need}개 필요`}</small></div>
    ${list.map(({c,i})=>`<button class="panel node ${open?'':'lk'}" data-i="${i}" ${open?'':'disabled'}>
     <span class="ic">${open?c.ic:'🔒'}</span><span class="nm"><b>${c.title}</b><small>${c.unit}</small></span>
     ${STARS[c.id]!==undefined?starStr(STARS[c.id]):'<small style="color:var(--dm)">NEW</small>'}</button>`).join('')}</div>`;}).join('')}
  </div>`;
 $('mBack').onclick=()=>{renderHome();show('scHome');};
 $('scMap').querySelectorAll('.node').forEach(b=>b.onclick=()=>startCase(+b.dataset.i));
}

/* ══════ 사건 진행 ══════ */
let C=null,ci=0,si=0,sel={},pts={},combo=0;
function startCase(i){ci=i;C=CASES[i];si=0;sel={};pts={};combo=0;show('scPlay');renderStep();}
function header(){
 return `<div class="topbar"><button class="ib" id="pBack">🗺</button>
  <div class="ttl"><span class="my">${C.title}</span><br><small style="color:var(--dm);font-size:11px">${C.unit}</small></div>
  ${combo>=2?`<span class="combo">🔥 콤보 x${combo}</span>`:''}</div>
  <div class="prog">${STEPS.map((s,i)=>`<span class="p ${i<si?'done':i===si?'on':''}">${s[0]}</span>`).join('')}</div>
  <div class="stepname my">STEP ${si+1} · ${STEPS[si][1]}</div>
  ${C.tier===0?`<div class="guide">${judge('happy','mini')}<div class="gb">${GUIDE[si]}</div></div>`:''}`;
}
function condHTML(){
 return `<div class="panel cond"><div class="ch">📋 사건 조건</div>
  <div class="chips">${C.cond.map(c=>`<span class="cchip">${c}</span>`).join('')}</div>
  <div class="goal">🎯 ${C.goal}</div></div>`;
}
function linesHTML(pick,mark){
 return `<div class="lines ${pick?'pick':''}">${C.steps.map((s,i)=>{
  let cls='';if(mark){if(i+1===C.brk)cls='right';else if(i+1===sel.line)cls='wrong';}else if(sel.line===i+1)cls='sel';
  return `<div class="ln ${cls}" data-i="${i+1}"><span class="no">${i+1}</span><span>${s}</span></div>`;}).join('')}</div>`;
}
function refHTML(){
 return `<details class="ref panel"><summary>📂 사건 다시 보기<span>▾</span></summary><div class="in">${condHTML()}${linesHTML(false,true)}</div></details>`;
}
function bindBack(){$('pBack').onclick=()=>{if(confirm('사건을 나가면 진행이 사라져요. 나갈까요?')){renderMap();show('scMap');}};}
function judgeRes(r){if(r==='ok'){combo++;if(combo>=2)toast(`🔥 콤보 x${combo}!`);}else combo=0;stamp(r);}
function next(){si++;if(si>=STEPS.length)renderVerdict();else renderStep();}

function renderStep(){
 const P=$('scPlay');
 /* 1. 문제 보기 */
 if(si===0){
  P.innerHTML=header()+`<div class="scroll">${condHTML()}<div class="sh">📝 피고의 풀이</div>${linesHTML(false,false)}</div>
   <div class="foot"><button class="btn" id="go">다 읽었다 — 오류 찾으러 ▶</button></div>`;
  bindBack();$('go').onclick=next;return;
 }
 /* 2. 오류 찾기 (위치 + 이유) */
 if(si===1){
  P.innerHTML=header()+`<div class="scroll">${condHTML()}
   <div class="sh">① 처음 틀린 줄은?</div>${linesHTML(true,false)}
   <div class="sh">② 왜 틀렸나?</div>
   ${C.why.map((w,i)=>`<button class="opt ${sel.why===i?'sel':''}" data-w="${i}">${w.t}</button>`).join('')}</div>
   <div class="foot"><button class="btn" id="go" ${sel.line&&sel.why!==undefined?'':'disabled'}>이걸로 결정 ▶</button></div>`;
  bindBack();
  P.querySelectorAll('.ln').forEach(el=>el.onclick=()=>{sel.line=+el.dataset.i;renderStep();});
  P.querySelectorAll('[data-w]').forEach(el=>el.onclick=()=>{sel.why=+el.dataset.w;renderStep();});
  $('go').onclick=next;return;
 }
 /* 3. 자신감 걸기 → 판정 공개 */
 if(si===2){
  if(sel.betDone){
   const lineOK=sel.line===C.brk,whyOK=!!C.why[sel.why].ok,both=lineOK&&whyOK;
   const fp=(lineOK?2:0)+(whyOK?2:0),bp=both?sel.bet:-sel.bet;
   pts.find=fp;pts.bet=bp;
   const res=both?'ok':(lineOK||whyOK)?'part':'no';
   P.innerHTML=header()+`<div class="scroll">${linesHTML(false,true)}
    <div class="fb ${lineOK?'ok':'no'}"><b>${lineOK?'✅ 위치 정확':'❌ 위치 오답'}</b>처음 틀린 곳은 ${C.brk}번째 줄이다.</div>
    <div class="fb ${whyOK?'ok':'no'}"><b>${whyOK?'✅ 이유 정확':'❌ 이유 오답'}</b>${C.why.find(w=>w.ok).t}</div>
    <div class="fb ${both?'ok':'no'}"><b>🎲 자신감 ${sel.bet}개 → ${bp>0?'+':''}${bp}</b>${both?'확신이 통했다!':'둘 다 맞혀야 건 만큼 얻는다.'}</div></div>
    <div class="foot"><button class="btn" id="go">증거 고르러 ▶</button></div>`;
   bindBack();if(!sel.stamped){sel.stamped=1;judgeRes(res);}
   $('go').onclick=next;return;
  }
  P.innerHTML=header()+`<div class="scroll">${refHTML()}
   <div class="sh">내 판단에 얼마나 확신해?</div>
   <div class="bets">${[[1,'🙂','조심'],[2,'😎','보통'],[3,'🔥','확신']].map(b=>`<button class="bet ${sel.bet===b[0]?'sel':''}" data-b="${b[0]}">
    <span class="e">${b[1]}</span><b>${b[2]}</b><small>±${b[0]}점</small></button>`).join('')}</div></div>
   <div class="foot"><button class="btn" id="go" ${sel.bet?'':'disabled'}>판정 받기 ⚖️</button></div>`;
  bindBack();
  P.querySelectorAll('.bet').forEach(el=>el.onclick=()=>{sel.bet=+el.dataset.b;renderStep();});
  $('go').onclick=()=>{sel.betDone=1;renderStep();};return;
 }
 /* 4~7. 선택형 단계 */
 const cfg={
  3:{key:'ev',title:'어떤 증거가 가장 확실할까?',opts:C.ev,pre:refHTML(),
     judge:i=>{const o=C.ev[i];return{p:o.s,r:o.s===2?'ok':o.s===1?'part':'no',msg:o.d,best:C.ev.filter(x=>x.s===2).map(x=>C.ev.indexOf(x))};}},
  4:{key:'rebut',title:'변호인의 말, 어떻게 볼까?',opts:C.rival.opts,
     pre:refHTML()+`<div class="claim">${judge('angry','mini')}<div class="cb"><small>🗣 변호인</small>${C.rival.claim}</div></div>`,
     judge:i=>{const ok=!!C.rival.opts[i].ok;return{p:ok?2:-2,r:ok?'ok':'no',msg:ok?'변호인 주장의 약점을 정확히 짚었다.':'변호인 주장의 진짜 약점을 놓쳤다.',best:[C.rival.opts.findIndex(x=>x.ok)]};}},
  5:{key:'q',title:'스스로 깨닫게 할 최후질문은?',opts:C.q,pre:refHTML(),
     judge:i=>{const o=C.q[i];return{p:o.ok?1:0,r:o.ok?'ok':'no',msg:o.ok?'답을 주지 않고, 볼 곳을 딱 짚어주는 질문이다.':o.d,best:[C.q.findIndex(x=>x.ok)]};}},
  6:{key:'fix',title:'가장 적게 고친다면?',opts:C.fix,pre:refHTML(),
     judge:i=>{const o=C.fix[i];return{p:o.ok?1:0,r:o.ok?'ok':'no',msg:o.ok?'필요한 만큼만 고쳐 논리를 되살렸다.':o.d,best:[C.fix.findIndex(x=>x.ok)]};}}
 }[si];
 const done=sel[cfg.key+'Done'];
 let res=null;if(done)res=cfg.judge(sel[cfg.key]);
 P.innerHTML=header()+`<div class="scroll">${cfg.pre}<div class="sh">${cfg.title}</div>
  ${cfg.opts.map((o,i)=>{let cls='';
   if(done){if(res.best.includes(i))cls='right';else if(i===sel[cfg.key])cls=res.r==='part'?'part':'wrong';}
   else if(sel[cfg.key]===i)cls='sel';
   return `<button class="opt ${cls}" data-o="${i}" ${done?'disabled':''}>${o.t}</button>`;}).join('')}
  ${done?`<div class="fb ${res.r}"><b>${res.r==='ok'?'✅ 인정':res.r==='part'?'🟡 일부 인정':'❌ 기각'} (${res.p>0?'+':''}${res.p})</b>${res.msg}</div>`:''}</div>
  <div class="foot"><button class="btn" id="go" ${sel[cfg.key]===undefined?'disabled':''}>${done?(si===6?'판결 보기 ⚖️':'다음 ▶'):'제출 ⚖️'}</button></div>`;
 bindBack();
 if(!done)P.querySelectorAll('[data-o]').forEach(el=>el.onclick=()=>{sel[cfg.key]=+el.dataset.o;renderStep();});
 $('go').onclick=()=>{
  if(!done){sel[cfg.key+'Done']=1;const r=cfg.judge(sel[cfg.key]);pts[cfg.key]=r.p;renderStep();judgeRes(r.r);}
  else next();
 };
}

/* ── 판결 ── */
function renderVerdict(){
 const total=Object.values(pts).reduce((a,b)=>a+b,0);
 const st=total>=11?3:total>=7?2:total>=3?1:0;
 const before=totStars();
 STARS[C.id]=Math.max(STARS[C.id]||0,st);
 if(C.tier===0)tutDone=true;
 const unlocked=TIERS.map((t,i)=>i).filter(i=>i>0&&totStars()>=TIERS[i].need&&before<TIERS[i].need&&tutDone);
 const mood=st>=2?'happy':st===1?'idle':'angry';
 const line=st===3?'완벽한 심리였어요! 명검사 탄생이군요.':st===2?'훌륭해요. 몇 군데만 다듬으면 완벽해요.':st===1?'방향은 좋았어요. 해설을 읽고 다시 도전해봐요.':'이번엔 피고가 이겼네요… 다시 붙어봅시다!';
 const rows=[['🔍','오류 찾기',pts.find],['🎲','자신감',pts.bet],['🧾','증거',pts.ev],['🗣','반박',pts.rebut],['❓','최후질문',pts.q],['✏️','고치기',pts.fix]];
 const nextI=CASES.findIndex((c,i)=>i>ci&&tierOpen(c.tier));
 $('scVerdict').innerHTML=`<div class="scroll"><div class="verdict">${judge(mood,'bounce')}
   <div class="big">${starStr(st)}</div>
   <div class="my" style="font-size:22px;color:var(--parch)">${total>0?'+':''}${total} / 13</div>
   <div class="guide" style="margin-top:12px;text-align:left"><div class="gb" style="border-radius:14px">${line}</div></div></div>
   ${rows.map(r=>`<div class="bd"><span class="e">${r[0]}</span><span class="l">${r[1]}</span>
    <span class="v ${r[2]>0?'pos':r[2]<0?'neg':'zero'}">${r[2]>0?'+':''}${r[2]}</span></div>`).join('')}
   ${unlocked.length?`<div class="fb ok" style="margin-top:12px"><b>🔓 새 단계 열림!</b>${unlocked.map(i=>TIERS[i].n).join(', ')}</div>`:''}
   ${C.tier===0?`<div class="fb part" style="margin-top:12px"><b>🎓 튜토리얼 완료!</b>이제 사건 지도에서 진짜 사건을 맡아보세요.</div>`:''}
  </div>
  <div class="foot row2">
   <button class="btn g" id="vRe" style="flex:0 0 auto;width:auto;padding:15px 16px">🔁</button>
   <button class="btn g" id="vMap">🗺 지도</button>
   ${nextI>=0?`<button class="btn" id="vNext">다음 사건 ▶</button>`:''}
  </div>`;
 show('scVerdict');
 $('vRe').onclick=()=>startCase(ci);
 $('vMap').onclick=()=>{renderMap();show('scMap');};
 if($('vNext'))$('vNext').onclick=()=>startCase(nextI);
}

renderHome();
</script>
</body>
</html>
